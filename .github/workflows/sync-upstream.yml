name: Sync upstream

# 每天 03:00（北京时间）检查上游 LiBwrt/LibWrt 25.12-nss：
#   - 上游 HEAD 与 .upstream-state 里记录的「已构建版本」相同 → 什么都不做
#   - 不同 → 把上游 merge 进来（不是 repo sync，避免冲掉 ax1800/ 下的提交）→ 触发构建
#
# 构建成功时 build.yml 会写回 .upstream-state；构建失败则不写，于是第二天还会重试，
# 不会因为一次失败就把上游版本漏掉。

on:
  # 自动同步暂停：Actions 账单锁着，合并了也构建不了，别让它每天空跑报错。
  # 账单恢复后把下面 schedule 两行解注释即可。
  # schedule:
  #   - cron: '0 19 * * *'    # 19:00 UTC = 次日 03:00 CST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 比对上游
        id: up
        run: |
          set -eu
          up=$(git ls-remote https://github.com/LiBwrt/LibWrt.git refs/heads/25.12-nss | awk '{print $1}')
          [ -n "$up" ] || { echo "::error::取不到上游 HEAD"; exit 1; }
          state=$(cat .upstream-state 2>/dev/null || echo "")
          echo "sha=$up" >> "$GITHUB_OUTPUT"
          if [ "$up" = "$state" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游未变（${up:0:8}），跳过"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游 ${up:0:8} ≠ 已构建 ${state:0:8}，需要合并"
            # 双保险（natserver 同款）：.upstream-state 若曾丢失，检查 Release 里
            # 是否已包含该上游短 SHA，避免对同一上游版本重复构建
            short=$(echo "$up" | cut -c1-12)
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq '[.[] | .name + " " + (.body // "")] | join(" ")' 2>/dev/null | grep -q "$short"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "上游 $short 已有对应 Release（.upstream-state 记录丢失），跳过重复构建"
            fi
          fi

      - name: 合并上游
        if: steps.up.outputs.changed == 'true'
        run: |
          set -eu
          git remote add upstream https://github.com/LiBwrt/LibWrt.git 2>/dev/null || true
          # 只取提交与树，不拉 blob：LibWrt 全量快照有几百 MB，每天拉一次不划算
          git fetch --filter=blob:none --no-tags upstream 25.12-nss
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "本地已包含上游提交（上次合并过但没构建成功），直接重新构建"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git merge --no-edit FETCH_HEAD; then
              # 唯一预期内的冲突是根 README（我们改写过它）；保留本地版本。
              # 其它文件冲突说明上游动了我们也在改的东西，交给人工处理。
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ "$conflicts" = "README.md" ]; then
                echo "README.md 冲突：保留本地版本"
                git checkout --ours README.md
                git add README.md
                git commit --no-edit
              else
                echo "::error::合并冲突，需要人工处理：$conflicts"
                exit 1
              fi
            fi
            git push origin HEAD:25.12-nss
            echo "已合并并推送"
          fi

      - name: 合并后自检
        # 上游同步的最大风险：merge 没冲突，但把 ax1800 定制冲掉了，或引入重复内核符号。
        # 这里在触发构建前先验关键标记，任一丢失直接红，不浪费一次 3 小时构建。
        run: |
          set -eu
          fail=0
          grep -q '^CONFIG_PACKAGE_kmod-tls=y' ax1800/config/packages.config \
            || { echo "::error::packages.config 丢了 kmod-tls（BUG#2 级联头）"; fail=1; }
          grep -q 'sqm-scripts-nss' .github/workflows/build.yml \
            || { echo "::error::build.yml 丢了 SQM 断言"; fail=1; }
          test -f ax1800/files/etc/uci-defaults/zz-ax1800 \
            || { echo "::error::zz-ax1800（BUG#1 IPv6 覆盖修复）丢了"; fail=1; }
          grep -q 'set-kernel-size' .github/workflows/build.yml \
            || { echo "::error::build.yml 丢了 KERNEL_SIZE 步骤"; fail=1; }
          dup=$(grep -oE '^(# )?CONFIG_[A-Z0-9_]+' target/linux/qualcommax/config-6.12 \
                  | sed 's/^# //' | sort | uniq -d | tr '\n' ' ')
          [ -z "$dup" ] || { echo "::error::config-6.12 有重复符号：$dup"; fail=1; }
          [ "$fail" -eq 0 ] && echo "[+] 合并后自检通过（关键标记齐全、无重复内核符号）"

      - name: 触发构建
        # Actions 账单恢复前手动触发；恢复后改回 if: steps.up.outputs.changed == 'true'
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref 25.12-nss -f kernel_size=12288
          sleep 5
          gh run list --workflow build.yml --limit 1 --json databaseId,status -q '.[] | "已派发 \(.databaseId) \(.status)"'
